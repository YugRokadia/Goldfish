<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" role="img" aria-label="Privacy diagram: files, embeddings and the index stay on your device. Only an opt-in Gmail search sends a query to Google and receives matching emails. No hosted search backend." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="hot" x1="0" x2="1"><stop offset="0" stop-color="#ff9d2e"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
<marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#fbbf24"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#93c5fd"/></marker>
</defs>
<rect width="1000" height="470" rx="16" fill="#0b1220"/>
<text x="500" y="34" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#64748b" letter-spacing="2">WHERE YOUR DATA GOES</text>

<!-- ===== YOUR DEVICE ===== -->
<rect x="20" y="52" width="630" height="362" rx="18" fill="#0f1a2e" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="10 6"><animate attributeName="stroke-opacity" values="1;.45;1" dur="3s" repeatCount="indefinite"/></rect>
<g transform="translate(42 64)"><rect x="0" y="8" width="16" height="12" rx="2" fill="#4ade80"/><path d="M3 8 V5 a5 5 0 0 1 10 0 V8" fill="none" stroke="#4ade80" stroke-width="2"/></g>
<text x="66" y="78" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#4ade80" letter-spacing="1.5">YOUR DEVICE</text>
<rect x="40" y="110" width="126" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="103.0" y="141" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Your files</text>
<text x="103.0" y="162" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">folders you choose</text>
<rect x="194" y="110" width="126" height="70" rx="12" fill="url(#hot)" stroke="#ffd08a" stroke-width="2"/>
<text x="257.0" y="141" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Goldfish engine</text>
<text x="257.0" y="162" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#fff3e0">extract · embed (NPU)</text>
<rect x="348" y="110" width="126" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="411.0" y="141" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Local index</text>
<text x="411.0" y="162" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">SQLite + FAISS</text>
<rect x="502" y="110" width="126" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="565.0" y="141" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Search UI</text>
<text x="565.0" y="162" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">results on screen</text>
<line x1="169" y1="145.0" x2="191" y2="145.0" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<line x1="323" y1="145.0" x2="345" y2="145.0" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<line x1="477" y1="145.0" x2="499" y2="145.0" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<path d="M257.0 182 V285 H476" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#ma)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
<text x="366" y="276" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#fbbf24">search text only</text>
<rect x="480" y="250" width="150" height="70" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
<text x="555.0" y="281" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Gmail connector</text>
<text x="555.0" y="302" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">opt-in · your OAuth</text>
<rect x="60" y="340" width="330" height="32" rx="16" fill="#14532d" fill-opacity=".45" stroke="#4ade80" stroke-opacity=".5"/>
<text x="225" y="361" text-anchor="middle" font-family="'Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#86efac">%LOCALAPPDATA%\Goldfish Search</text>
<text x="335" y="399" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#94a3b8">Files, embeddings and the search index never leave this boundary.</text>
<rect x="730" y="205" width="250" height="170" rx="16" fill="#1a1608" fill-opacity=".55" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6"/>
<text x="750" y="230" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24" letter-spacing="1.5">GOOGLE · OPT-IN ONLY</text>
<rect x="750" y="245" width="210" height="70" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
<text x="855" y="275" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Gmail API</text>
<text x="855" y="296" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">answers email searches</text>
<g transform="translate(752 336)"><circle cx="9" cy="9" r="9" fill="#14532d"/><path d="M4.5 9.5 L8 13 L14 6" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="778" y="350" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#86efac">Your files are never sent here</text>

<!-- query out / emails back -->
<line x1="632" y1="268" x2="748" y2="268" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#ma)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></line>
<line x1="748" y1="298" x2="632" y2="298" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#mb)"><animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.2s" repeatCount="indefinite"/></line>
<text x="690" y="258" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#fbbf24">query</text>
<text x="690" y="318" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#93c5fd">emails</text>
<line x1="652" y1="130" x2="728" y2="130" stroke="#64748b" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="730" y="90" width="250" height="80" rx="12" fill="#1e293b" fill-opacity=".5" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<text x="855" y="122" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#94a3b8">Hosted search backend</text>
<text x="855" y="146" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">no uploads · no cloud index</text>
<g stroke="#ef4444" stroke-width="4" stroke-linecap="round"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
<line x1="679" y1="118" x2="699" y2="142"/><line x1="699" y1="118" x2="679" y2="142"/></g>
<text x="855" y="188" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ef4444" letter-spacing="1.5">NOT USED</text>

