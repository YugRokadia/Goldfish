<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" role="img" aria-label="Privacy diagram: documents, embeddings and the index stay on your device; Gmail is opt-in; no hosted search backend" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="hot" x1="0" x2="1"><stop offset="0" stop-color="#ff9d2e"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
</defs>
<rect width="1000" height="440" rx="16" fill="#0b1220"/>
<text x="500" y="34" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#64748b" letter-spacing="2">WHERE YOUR DATA GOES</text>

<!-- device boundary -->
<rect x="20" y="52" width="650" height="336" rx="18" fill="#0f1a2e" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="10 6">
<animate attributeName="stroke-opacity" values="1;.45;1" dur="3s" repeatCount="indefinite"/></rect>
<g transform="translate(42 66)"><rect x="0" y="8" width="16" height="12" rx="2" fill="#4ade80"/><path d="M3 8 V5 a5 5 0 0 1 10 0 V8" fill="none" stroke="#4ade80" stroke-width="2"/></g>
<text x="66" y="80" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#4ade80" letter-spacing="1.5">YOUR DEVICE</text>

<rect x="45" y="150" width="120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="105.0" y="182" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Your files</text>
<text x="105.0" y="204" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">folders you choose</text>
<rect x="195" y="150" width="120" height="70" rx="12" fill="url(#hot)" stroke="#ffd08a" stroke-width="2"/>
<text x="255.0" y="182" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Goldfish engine</text>
<text x="255.0" y="204" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#fff3e0">extract · embed (NPU)</text>
<rect x="345" y="150" width="120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="405.0" y="182" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Local index</text>
<text x="405.0" y="204" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">SQLite + FAISS</text>
<rect x="495" y="150" width="120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="555.0" y="182" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Search UI</text>
<text x="555.0" y="204" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">results on screen</text>
<line x1="169" y1="185.0" x2="191" y2="185.0" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<line x1="319" y1="185.0" x2="341" y2="185.0" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<line x1="469" y1="185.0" x2="491" y2="185.0" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<rect x="120" y="270" width="440" height="34" rx="17" fill="#14532d" fill-opacity=".45" stroke="#4ade80" stroke-opacity=".5"/>
<text x="340" y="292" text-anchor="middle" font-family="'Cascadia Code',Consolas,'Courier New',monospace" font-size="13" fill="#86efac">%LOCALAPPDATA%\Goldfish Search</text>
<text x="345" y="336" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Documents, embeddings and the search index never leave this boundary.</text>
<path id="gm" d="M255 150 L255 108 L705 108 L705 130 L740 130" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
<circle r="6" fill="#fde68a"><animateMotion dur="5s" repeatCount="indefinite" path="M255 150 L255 108 L705 108 L705 130 L740 130"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="5s" repeatCount="indefinite"/></circle>
<text x="480" y="98" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#fbbf24">opt-in · email searches only · your own OAuth</text>
<rect x="740" y="90" width="230" height="80" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
<text x="855" y="122" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Gmail API</text>
<text x="855" y="146" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8">Google · queried on demand</text>
<line x1="672" y1="290" x2="740" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="740" y="250" width="230" height="80" rx="12" fill="#1e293b" fill-opacity=".5" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<text x="855" y="282" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#94a3b8">Hosted search backend</text>
<text x="855" y="306" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">no uploads · no cloud index</text>
<g stroke="#ef4444" stroke-width="4" stroke-linecap="round"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
<line x1="696" y1="278" x2="716" y2="302"/><line x1="716" y1="278" x2="696" y2="302"/></g>
<text x="855" y="350" text-anchor="middle" font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#ef4444" letter-spacing="1.5">NOT USED</text>

<!-- legend -->
<g font-family="'Segoe UI Variable','Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#94a3b8">
<line x1="250" y1="415" x2="280" y2="415" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 5"/><text x="288" y="419">stays on device</text>
<line x1="420" y1="415" x2="450" y2="415" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 6"/><text x="458" y="419">opt-in, on request</text>
<line x1="610" y1="415" x2="640" y2="415" stroke="#ef4444" stroke-width="3"/><text x="648" y="419">not used</text>
</g>
</svg>