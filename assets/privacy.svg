<line x1="130" y1="446" x2="160" y2="446" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="5 5"/><text x="168" y="450">stays on device</text>
<line x1="300" y1="446" x2="330" y2="446" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 6"/><text x="338" y="450">search query out (opt-in)</text>
<line x1="520" y1="446" x2="550" y2="446" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 6"/><text x="558" y="450">matching emails back</text>
<line x1="720" y1="446" x2="750" y2="446" stroke="#ef4444" stroke-width="3"/><text x="758" y="450">not used</text>
