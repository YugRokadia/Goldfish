<line x1="806.0" y1="110.0" x2="826.0" y2="110.0" stroke="#ff9d2e" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<g><rect x="829.0" y="70" width="132" height="80" rx="14" fill="url(#n)" stroke="#334155" stroke-width="2"></rect>
<text x="895.0" y="106" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Results</text>
<text x="895.0" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">semantic + lexical</text></g>
<line x1="49.0" y1="174" x2="951.0" y2="174" stroke="#1e293b" stroke-width="2"/>
<circle r="7" fill="#ffd08a"><animateMotion dur="6s" repeatCount="indefinite" path="M49.0 174 L951.0 174"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="6s" repeatCount="indefinite"/></circle>
<text x="500" y="205" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#475569">Query → embed → hybrid retrieval → open in the native app</text>
</svg>