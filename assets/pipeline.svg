<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" role="img" aria-label="Goldfish ingestion and retrieval pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="n" x1="0" x2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<linearGradient id="hot" x1="0" x2="1"><stop offset="0" stop-color="#ff9d2e"/><stop offset="1" stop-color="#ff6a00"/></linearGradient></defs>
<rect width="1000" height="220" rx="16" fill="#0b1220"/>
<text x="500" y="38" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#64748b" letter-spacing="2">EVERYTHING STAYS ON YOUR DEVICE</text>
<g><rect x="39.0" y="70" width="132" height="80" rx="14" fill="url(#n)" stroke="#334155" stroke-width="2"></rect>
<text x="105.0" y="106" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Files &amp; Gmail</text>
<text x="105.0" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">watch + fetch</text></g>
<line x1="174.0" y1="110.0" x2="194.0" y2="110.0" stroke="#ff9d2e" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<g><rect x="197.0" y="70" width="132" height="80" rx="14" fill="url(#n)" stroke="#334155" stroke-width="2"></rect>
<text x="263.0" y="106" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Extract</text>
<text x="263.0" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">text from docs</text></g>
<line x1="332.0" y1="110.0" x2="352.0" y2="110.0" stroke="#ff9d2e" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<g><rect x="355.0" y="70" width="132" height="80" rx="14" fill="url(#n)" stroke="#334155" stroke-width="2"></rect>
<text x="421.0" y="106" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Chunk</text>
<text x="421.0" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#94a3b8">split + clean</text></g>
<line x1="490.0" y1="110.0" x2="510.0" y2="110.0" stroke="#ff9d2e" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<g><rect x="513.0" y="70" width="132" height="80" rx="14" fill="url(#hot)" stroke="#ffd08a" stroke-width="2"><animate attributeName="stroke-opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></rect>
<text x="579.0" y="106" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Embed</text>
<text x="579.0" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#fff3e0">ONNX Runtime · NPU</text></g>
<line x1="648.0" y1="110.0" x2="668.0" y2="110.0" stroke="#ff9d2e" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></line>
<g><rect x="671.0" y="70" width="132" height="80" rx="14" fill="url(#n)" stroke="#334155" stroke-width="2"></rect>
<text x="737.0" y="106" text-anchor="middle" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Index</text>
